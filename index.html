<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CBC Cavite Event Attendance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f3f5f1;--surface:#fff;--ink:#1d2a26;--muted:#66736e;--line:#d5dcd6;--green:#1f7a55;--greenbg:#dff1e8;--amber:#9a6a0a;--amberbg:#f7ecd0;--blue:#25608f;--bluebg:#dce9f4;--red:#b3402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#141a18;--surface:#1d2623;--ink:#e6ede9;--muted:#93a29b;--line:#2f3b37;--green:#5cc79b;--greenbg:#1d3a2e;--amber:#e6bd62;--amberbg:#3d3115;--blue:#7db8e8;--bluebg:#1c3347;--red:#ee8b7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3","Segoe UI",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 64px}
h1{font:700 1.8rem/1.2 "Source Serif 4",Georgia,serif;margin:0 0 16px}
h2{font:700 1.15rem/1.3 "Source Serif 4",Georgia,serif;margin:0 0 12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:4px;flex:1;min-width:130px;margin-bottom:10px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;width:100%}
.lbl{font-size:.85rem;color:var(--muted);margin:4px 0}
.choices{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.choices button{flex:1;min-width:90px;padding:12px 8px;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px}
button.on{background:var(--green);border-color:var(--green);color:#fff}
button.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){button.on,button.primary{color:#0e1a15}}
button.danger{color:var(--red)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.hide{display:none!important}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:.85rem}
td.n,th.n{text-align:center}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
.scroll{overflow-x:auto}
.tag{padding:2px 9px;border-radius:99px;font-size:.82rem;font-weight:600;white-space:nowrap}
.t-Member{background:var(--greenbg);color:var(--green)}.t-Visitor{background:var(--amberbg);color:var(--amber)}.t-Regular{background:var(--bluebg);color:var(--blue)}
.ev{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}.ev .info{flex:1;min-width:150px}.ev small{color:var(--muted);display:block}
.msg{color:var(--muted);padding:8px 0}
.x{border:0;padding:2px 8px;color:var(--muted)}
.head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;margin-bottom:12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:.9rem;color:var(--muted)}
@media print{body{background:#fff}.noprint{display:none!important}}
</style>
</head>
<body>
<main>
<h1>CBC Cavite event attendance</h1>

<section class="panel" id="login">
  <h2>Sign in</h2>
  <label>Email<input id="email" type="email" autocomplete="username"></label>
  <label>Password<input id="pass" type="password" autocomplete="current-password"></label>
  <div id="lerr" class="msg" style="color:var(--red)"></div>
  <button class="primary" id="signin">Sign in</button>
</section>

<div id="app" class="hide">
<div class="bar noprint"><span id="who"></span><button id="signout">Sign out</button></div>

<section class="panel" id="setup">
  <h2>Event details</h2>
  <div class="lbl">Event type</div>
  <div class="choices" id="tplBtns"></div>
  <label id="enameWrap" class="hide">Event name<input id="ename" placeholder="e.g. Celebration Service"></label>
  <div class="row">
    <label>Date<input id="edate" type="date"></label>
    <label>Time<input id="etime" type="time"></label>
  </div>
  <button class="primary hide" id="start">Start check-in</button>
</section>

<section class="panel hide" id="savedPanel">
  <h2>Saved events</h2>
  <div id="savedList"></div>
  <div class="row" style="margin-top:12px">
    <button id="allXlsx">Download all (Excel)</button>
    <button id="backup">Backup file</button>
    <button id="restoreBtn">Restore backup</button>
    <input type="file" id="restore" accept=".json,application/json" class="hide">
  </div>
</section>

<div id="live" class="hide">
  <section class="panel">
    <div class="head"><h2 id="evtitle" style="margin:0"></h2><span id="evwhen" class="msg"></span><button id="back" class="noprint">All events</button></div>
    <div id="checkin">
      <label>Name<input id="name" autocomplete="off" placeholder="Full name"></label>
      <div class="lbl">Type</div>
      <div class="choices" id="typeBtns">
        <button data-v="Member">Member</button><button data-v="Visitor">Visitor</button><button data-v="Regular Visitor">Regular Visitor</button>
      </div>
      <label id="invWrap" class="hide">Invited by<input id="inv" autocomplete="off" placeholder="Name of the person who invited them"></label>
      <div class="lbl">Age group</div>
      <div class="choices" id="demoBtns">
        <button data-v="Adult">Adult</button><button data-v="Youth">Youth</button><button data-v="Kids">Kids</button>
      </div>
      <div id="err" class="msg" style="color:var(--red)"></div>
      <button class="primary" id="add">Add to attendance</button>
    </div>
  </section>

  <section class="panel">
    <h2>Overview</h2>
    <div class="scroll"><table>
      <thead><tr><th>Name</th><th>Type</th><th>Invited by</th><th>Age group</th><th class="noprint"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div id="empty" class="msg">No one has checked in yet.</div>
    <h2 style="margin-top:18px">Summary</h2>
    <div class="scroll"><table>
      <thead><tr><th>Type</th><th class="n">Adult</th><th class="n">Youth</th><th class="n">Kids</th><th class="n">Total</th></tr></thead>
      <tbody id="sum"></tbody><tfoot id="sumfoot"></tfoot>
    </table></div>
  </section>

  <section class="panel noprint">
    <div id="finishBox"><button class="primary" id="done">Event done</button></div>
    <div id="doneBox" class="hide">
      <h2>Event finished</h2>
      <div class="row" style="margin-bottom:10px">
        <button class="primary" id="xlsx">Download Excel</button>
        <button class="primary" id="pdf">Download PDF</button>
        <button id="csv">Download CSV</button>
      </div>
      <div class="row"><button id="reopen">Reopen event</button><button id="newEv">New event</button></div>
    </div>
  </section>
</div>
</div>
</main>

<script>
// ---- Firebase settings (from your Firebase console) ----
const firebaseConfig = {
  apiKey: "AIzaSyAD_H5blVroRJP0-_K81A7TrPCoQnJ1t54",
  authDomain: "cbcfcavite-event-attendance.firebaseapp.com",
  projectId: "cbcfcavite-event-attendance",
  storageBucket: "cbcfcavite-event-attendance.firebasestorage.app",
  messagingSenderId: "10719951786",
  appId: "1:10719951786:web:cce48f77701a8c86cb49d3"
};
// --------------------------------------------------------
const $=id=>document.getElementById(id);
const TYPES=['Member','Visitor','Regular Visitor'];
const TEMPLATES=['Celebration Service','Youth LINK','Other'];  // add or rename event types here
let tpl='',EVENTS=[],curId=null,type='',demo='',unsub=null,auth,db;
const tagCls=t=>'t-'+t.split(' ')[0];
const uid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const E=()=>EVENTS.find(e=>e.id===curId)||null;
function fmtTime(t){if(!t)return'';const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM')}
const people=ev=>[...(ev.people||[])].sort((a,b)=>(a.t||0)-(b.t||0));

try{
  firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();
}catch(e){$('lerr').textContent='Could not load Firebase. Check your internet connection and reload.'}

$('edate').value=new Date().toISOString().slice(0,10);
const nt=new Date();$('etime').value=String(nt.getHours()).padStart(2,'0')+':'+String(nt.getMinutes()).padStart(2,'0');

// ---- sign in / out ----
$('signin').onclick=async()=>{
  if(!auth)return;
  $('lerr').textContent='';
  try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('pass').value)}
  catch(e){$('lerr').textContent=(e.code==='auth/network-request-failed')?'No internet connection.':'Wrong email or password.'}
};
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('signin').click()});
$('signout').onclick=()=>auth.signOut();
if(auth)auth.onAuthStateChanged(u=>{
  $('login').classList.toggle('hide',!!u);$('app').classList.toggle('hide',!u);
  if(unsub){unsub();unsub=null}
  if(!u){EVENTS=[];curId=null;return}
  $('who').textContent='Signed in as '+u.email;$('pass').value='';
  unsub=db.collection('events').orderBy('created').onSnapshot(
    snap=>{EVENTS=snap.docs.map(d=>({id:d.id,...d.data()}));render()},
    e=>alert('Could not load events: '+e.message)
  );
});
const guard=p=>p.catch(e=>alert('Could not save: '+e.message));

// ---- event type choices ----
TEMPLATES.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.dataset.v=t;$('tplBtns').append(b)});
$('tplBtns').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  tpl=b.dataset.v;pick($('tplBtns'),b);
  $('enameWrap').classList.remove('hide');$('start').classList.remove('hide');
  $('ename').value=tpl==='Other'?'':tpl;$('ename').focus();
  if(tpl!=='Other')$('ename').setSelectionRange(tpl.length,tpl.length);
};
// ---- buttons ----
function pick(group,btn){[...group.children].forEach(b=>b.classList.toggle('on',b===btn))}
$('typeBtns').onclick=e=>{const b=e.target.closest('button');if(!b)return;type=b.dataset.v;pick($('typeBtns'),b);$('invWrap').classList.toggle('hide',type==='Member');if(type==='Member')$('inv').value=''};
$('demoBtns').onclick=e=>{const b=e.target.closest('button');if(!b)return;demo=b.dataset.v;pick($('demoBtns'),b)};
function err(m){$('err').textContent=m}

$('start').onclick=()=>{
  const name=$('ename').value.trim();
  if(!name){$('ename').focus();return}
  const ref=db.collection('events').doc();
  curId=ref.id;tpl='';pick($('tplBtns'),null);$('enameWrap').classList.add('hide');$('start').classList.add('hide');$('ename').value='';
  guard(ref.set({kind:tpl,name,date:$('edate').value,time:$('etime').value,done:false,people:[],created:Date.now()}));
};
$('add').onclick=()=>{
  const ev=E();if(!ev)return;
  const n=$('name').value.trim();
  if(!n)return err('Enter a name.');
  if(!type)return err('Choose Member, Visitor, or Regular Visitor.');
  if(!demo)return err('Choose Adult, Youth, or Kids.');
  err('');
  const p={id:uid(),name:n,type,inv:type==='Member'?'':$('inv').value.trim(),demo,t:Date.now()};
  guard(db.collection('events').doc(ev.id).update({people:firebase.firestore.FieldValue.arrayUnion(p)}));
  $('name').value='';$('inv').value='';type='';demo='';
  pick($('typeBtns'),null);pick($('demoBtns'),null);$('invWrap').classList.add('hide');$('name').focus();
};
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click()});
$('done').onclick=()=>guard(db.collection('events').doc(curId).update({done:true}));
$('reopen').onclick=()=>guard(db.collection('events').doc(curId).update({done:false}));
const toList=()=>{curId=null;render();window.scrollTo(0,0)};
$('newEv').onclick=toList;$('back').onclick=toList;

// ---- rendering ----
function counts(ev){const c={Adult:0,Youth:0,Kids:0,Member:0,Visitor:0,'Regular Visitor':0};people(ev).forEach(p=>{c[p.demo]++;c[p.type]++});return c}
function matrix(ev){
  const m={};TYPES.forEach(t=>{m[t]={Adult:0,Youth:0,Kids:0,Total:0}});
  const tot={Adult:0,Youth:0,Kids:0,Total:0};
  people(ev).forEach(p=>{m[p.type][p.demo]++;m[p.type].Total++;tot[p.demo]++;tot.Total++});
  return{m,tot};
}
function renderSaved(){
  const box=$('savedList');box.innerHTML='';
  $('savedPanel').classList.toggle('hide',!EVENTS.length);
  [...EVENTS].reverse().forEach(ev=>{
    const r=document.createElement('div');r.className='ev';
    const i=document.createElement('div');i.className='info';
    const b=document.createElement('b');b.textContent=ev.name;
    const sm=document.createElement('small');sm.textContent=[ev.date,fmtTime(ev.time),(ev.people||[]).length+' people',ev.done?'Finished':'In progress'].filter(Boolean).join(' · ');
    i.append(b,sm);
    const o=document.createElement('button');o.textContent='Open';o.onclick=()=>{curId=ev.id;render();window.scrollTo(0,0)};
    const d=document.createElement('button');d.className='danger';d.textContent='Delete';
    d.onclick=()=>{if(confirm('Delete "'+ev.name+'" and its '+(ev.people||[]).length+' check-ins for everyone? This cannot be undone.'))guard(db.collection('events').doc(ev.id).delete())};
    r.append(i,o,d);box.append(r);
  });
}
function render(){
  const ev=E();
  renderSaved();
  $('setup').classList.toggle('hide',!!ev);$('live').classList.toggle('hide',!ev);
  if(!ev)return;
  $('evtitle').textContent=ev.name;
  $('evwhen').textContent=[ev.date,fmtTime(ev.time)].filter(Boolean).join(' at ');
  $('checkin').classList.toggle('hide',!!ev.done);
  $('finishBox').classList.toggle('hide',!!ev.done);$('doneBox').classList.toggle('hide',!ev.done);
  const tb=$('rows');tb.innerHTML='';
  const list=people(ev);
  list.forEach(p=>{
    const tr=document.createElement('tr');
    const c=t=>{const td=document.createElement('td');td.textContent=t;return td};
    tr.append(c(p.name));
    const tt=document.createElement('td');const sp=document.createElement('span');sp.className='tag '+tagCls(p.type);sp.textContent=p.type;tt.append(sp);tr.append(tt);
    tr.append(c(p.inv||'-'),c(p.demo));
    const xd=document.createElement('td');xd.className='noprint';
    if(!ev.done){const b=document.createElement('button');b.className='x';b.textContent='✕';b.setAttribute('aria-label','Remove '+p.name);
      b.onclick=()=>guard(db.collection('events').doc(ev.id).update({people:firebase.firestore.FieldValue.arrayRemove(p)}));xd.append(b)}
    tr.append(xd);tb.append(tr);
  });
  $('empty').classList.toggle('hide',list.length>0);
  const{m,tot}=matrix(ev);
  $('sum').innerHTML=TYPES.map(t=>`<tr><td>${t}</td><td class="n">${m[t].Adult}</td><td class="n">${m[t].Youth}</td><td class="n">${m[t].Kids}</td><td class="n"><b>${m[t].Total}</b></td></tr>`).join('');
  $('sumfoot').innerHTML=`<tr><td>Total</td><td class="n">${tot.Adult}</td><td class="n">${tot.Youth}</td><td class="n">${tot.Kids}</td><td class="n">${tot.Total}</td></tr>`;
}

// ---- exports ----
const fname=ext=>{const ev=E();return 'attendance-'+ev.name.replace(/[^\w\-]+/g,'_')+'-'+(ev.date||'event')+'.'+ext};
const listRows=ev=>people(ev).map((p,i)=>[i+1,p.name,p.type,p.inv||'',p.demo]);
const sumRows=ev=>{const{m,tot}=matrix(ev);return[...TYPES.map(t=>[t,m[t].Adult,m[t].Youth,m[t].Kids,m[t].Total]),['Total',tot.Adult,tot.Youth,tot.Kids,tot.Total]]};
$('xlsx').onclick=()=>{
  if(typeof XLSX==='undefined')return alert('The Excel library could not load. Check your internet connection and try again.');
  const ev=E(),wb=XLSX.utils.book_new();
  const a=XLSX.utils.aoa_to_sheet([[ev.name],['Date',ev.date],['Time',fmtTime(ev.time)],[],['No.','Name','Type','Invited by','Age group'],...listRows(ev)]);
  a['!cols']=[{wch:6},{wch:30},{wch:16},{wch:26},{wch:12}];
  const s=XLSX.utils.aoa_to_sheet([[ev.name],[],['Type','Adult','Youth','Kids','Total'],...sumRows(ev)]);
  s['!cols']=[{wch:18},{wch:8},{wch:8},{wch:8},{wch:8}];
  XLSX.utils.book_append_sheet(wb,a,'Attendance');XLSX.utils.book_append_sheet(wb,s,'Summary');
  XLSX.writeFile(wb,fname('xlsx'));
};
$('pdf').onclick=()=>{
  if(!(window.jspdf&&window.jspdf.jsPDF))return alert('The PDF library could not load. Check your internet connection and try again.');
  const ev=E(),d=new window.jspdf.jsPDF();
  d.setFontSize(18);d.text(ev.name,14,18);d.setFontSize(11);
  d.text('Date: '+(ev.date||'-')+'     Time: '+(fmtTime(ev.time)||'-'),14,26);
  d.autoTable({startY:32,head:[['Type','Adult','Youth','Kids','Total']],body:sumRows(ev),headStyles:{fillColor:[31,78,61]},
    didParseCell:h=>{if(h.row.index===3&&h.section==='body')h.cell.styles.fontStyle='bold'}});
  d.autoTable({startY:d.lastAutoTable.finalY+8,head:[['No.','Name','Type','Invited by','Age group']],body:listRows(ev),headStyles:{fillColor:[31,78,61]}});
  d.save(fname('pdf'));
};
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
$('csv').onclick=()=>{
  const ev=E(),q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['No.','Name','Type','Invited by','Age group','Event','Date','Time'],...listRows(ev).map(r=>[...r,ev.name,ev.date,fmtTime(ev.time)])];
  dl(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),fname('csv'));
};
$('allXlsx').onclick=()=>{
  if(typeof XLSX==='undefined')return alert('The Excel library could not load. Check your internet connection and try again.');
  const all=[['Event','Date','Time','Name','Type','Invited by','Age group']];
  const sm=[['Event','Date','Time','Members','Visitors','Regular Visitors','Adult','Youth','Kids','Total']];
  EVENTS.forEach(ev=>{
    people(ev).forEach(p=>all.push([ev.name,ev.date,fmtTime(ev.time),p.name,p.type,p.inv||'',p.demo]));
    const c=counts(ev);sm.push([ev.name,ev.date,fmtTime(ev.time),c.Member,c.Visitor,c['Regular Visitor'],c.Adult,c.Youth,c.Kids,(ev.people||[]).length]);
  });
  const wb=XLSX.utils.book_new();
  const a=XLSX.utils.aoa_to_sheet(all);a['!cols']=[{wch:24},{wch:12},{wch:10},{wch:28},{wch:16},{wch:26},{wch:11}];
  const b=XLSX.utils.aoa_to_sheet(sm);b['!cols']=[{wch:24},{wch:12},{wch:10},{wch:9},{wch:9},{wch:16},{wch:7},{wch:7},{wch:7},{wch:7}];
  XLSX.utils.book_append_sheet(wb,a,'All attendance');XLSX.utils.book_append_sheet(wb,b,'Event summaries');
  XLSX.writeFile(wb,'attendance-all-events.xlsx');
};
$('backup').onclick=()=>dl(new Blob([JSON.stringify({events:EVENTS},null,1)],{type:'application/json'}),'attendance-backup-'+new Date().toISOString().slice(0,10)+'.json');
$('restoreBtn').onclick=()=>$('restore').click();
$('restore').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);if(!d||!Array.isArray(d.events))throw 0;
      const have=new Set(EVENTS.map(x=>x.id));let n=0;
      for(const ev of d.events){
        if(!ev||ev.name===undefined||!Array.isArray(ev.people))continue;
        const ref=ev.id&&!have.has(ev.id)?db.collection('events').doc(String(ev.id)):(ev.id?null:db.collection('events').doc());
        if(!ref)continue;
        const {id,...rest}=ev;
        rest.people=rest.people.map((p,i)=>({id:p.id||uid(),t:p.t||(Date.now()+i),...p}));
        rest.created=rest.created||Date.now();rest.done=!!rest.done;
        await ref.set(rest);n++;
      }
      alert(n+' event(s) restored.');
    }catch(x){alert('That file is not a valid attendance backup.')}
    e.target.value='';
  };
  r.readAsText(f);
};
</script>
</body>
</html>
