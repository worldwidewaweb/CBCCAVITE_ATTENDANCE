<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event Attendance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f3f5f1;--surface:#fff;--ink:#1d2a26;--muted:#66736e;--line:#d5dcd6;--green:#1f7a55;--greenbg:#dff1e8;--amber:#9a6a0a;--amberbg:#f7ecd0;--blue:#25608f;--bluebg:#dce9f4;--red:#b3402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#141a18;--surface:#1d2623;--ink:#e6ede9;--muted:#93a29b;--line:#2f3b37;--green:#5cc79b;--greenbg:#1d3a2e;--amber:#e6bd62;--amberbg:#3d3115;--blue:#7db8e8;--bluebg:#1c3347;--red:#ee8b7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3","Segoe UI",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 64px}
h1{font:700 1.8rem/1.2 "Source Serif 4",Georgia,serif;margin:0 0 16px}
h2{font:700 1.15rem/1.3 "Source Serif 4",Georgia,serif;margin:0 0 12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:4px;flex:1;min-width:130px;margin-bottom:10px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;width:100%}
.lbl{font-size:.85rem;color:var(--muted);margin:4px 0}
.choices{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.choices button{flex:1;min-width:90px;padding:12px 8px;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px}
button.on{background:var(--green);border-color:var(--green);color:#fff}
@media (prefers-color-scheme:dark){button.on{color:#0e1a15}}
button.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){button.primary{color:#0e1a15}}
button.danger{color:var(--red)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.hide{display:none!important}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:.85rem}
td.n,th.n{text-align:center}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
.scroll{overflow-x:auto}
.tag{padding:2px 9px;border-radius:99px;font-size:.82rem;font-weight:600;white-space:nowrap}
.t-Member{background:var(--greenbg);color:var(--green)}.t-Visitor{background:var(--amberbg);color:var(--amber)}.t-Regular{background:var(--bluebg);color:var(--blue)}
.msg{color:var(--muted);padding:8px 0}
.x{border:0;padding:2px 8px;color:var(--muted)}
.head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;margin-bottom:12px}
.big{font:700 2rem/1 "Source Serif 4",Georgia,serif}
@media print{body{background:#fff}.noprint{display:none!important}}
</style>
</head>
<body>
<main>
<h1>Event attendance</h1>

<section class="panel" id="setup">
  <h2>Event details</h2>
  <label>Event name<input id="ename" placeholder="e.g. Sunday Service"></label>
  <div class="row">
    <label>Date<input id="edate" type="date"></label>
    <label>Time<input id="etime" type="time"></label>
  </div>
  <button class="primary" id="start">Start check-in</button>
</section>

<div id="live" class="hide">
  <section class="panel">
    <div class="head"><h2 id="evtitle" style="margin:0"></h2><span id="evwhen" class="msg"></span></div>
    <div id="checkin">
      <label>Name<input id="name" autocomplete="off" placeholder="Full name"></label>
      <div class="lbl">Type</div>
      <div class="choices" id="typeBtns">
        <button data-v="Member">Member</button><button data-v="Visitor">Visitor</button><button data-v="Regular Visitor">Regular Visitor</button>
      </div>
      <label id="invWrap" class="hide">Invited by<input id="inv" autocomplete="off" placeholder="Name of the person who invited them"></label>
      <div class="lbl">Age group</div>
      <div class="choices" id="demoBtns">
        <button data-v="Adult">Adult</button><button data-v="Youth">Youth</button><button data-v="Kids">Kids</button>
      </div>
      <div id="err" class="msg" style="color:var(--red)"></div>
      <button class="primary" id="add">Add to attendance</button>
    </div>
  </section>

  <section class="panel">
    <h2>Overview</h2>
    <div class="scroll"><table>
      <thead><tr><th>Name</th><th>Type</th><th>Invited by</th><th>Age group</th><th class="noprint"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div id="empty" class="msg">No one has checked in yet.</div>
    <h2 style="margin-top:18px">Summary</h2>
    <div class="scroll"><table>
      <thead><tr><th>Type</th><th class="n">Adult</th><th class="n">Youth</th><th class="n">Kids</th><th class="n">Total</th></tr></thead>
      <tbody id="sum"></tbody><tfoot id="sumfoot"></tfoot>
    </table></div>
  </section>

  <section class="panel noprint">
    <div id="finishBox"><button class="primary" id="done">Event done</button></div>
    <div id="doneBox" class="hide">
      <h2>Event finished</h2>
      <div class="row" style="margin-bottom:10px">
        <button class="primary" id="xlsx">Download Excel</button>
        <button class="primary" id="pdf">Download PDF</button>
        <button id="csv">Download CSV</button>
      </div>
      <div class="row"><button id="reopen">Reopen event</button><button class="danger" id="newEv">Start a new event</button></div>
    </div>
  </section>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const TYPES=['Member','Visitor','Regular Visitor'], DEMOS=['Adult','Youth','Kids'];
let E=null, type='', demo='';
const tagCls=t=>'t-'+t.split(' ')[0];
function save(){try{localStorage.setItem('evt-v2',JSON.stringify(E))}catch(e){}}
try{const s=JSON.parse(localStorage.getItem('evt-v2')||'null');if(s&&s.name!==undefined)E=s}catch(e){}
$('edate').value=new Date().toISOString().slice(0,10);
const nowT=new Date();$('etime').value=String(nowT.getHours()).padStart(2,'0')+':'+String(nowT.getMinutes()).padStart(2,'0');

function fmtTime(t){if(!t)return'';const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM')}
function pick(group,btn){[...group.children].forEach(b=>b.classList.toggle('on',b===btn))}
$('typeBtns').onclick=e=>{const b=e.target.closest('button');if(!b)return;type=b.dataset.v;pick($('typeBtns'),b);$('invWrap').classList.toggle('hide',type==='Member');if(type==='Member')$('inv').value=''};
$('demoBtns').onclick=e=>{const b=e.target.closest('button');if(!b)return;demo=b.dataset.v;pick($('demoBtns'),b)};

$('start').onclick=()=>{
  const name=$('ename').value.trim();
  if(!name){$('ename').focus();return}
  E={name,date:$('edate').value,time:$('etime').value,people:[],done:false};save();render();
};
$('add').onclick=()=>{
  const n=$('name').value.trim();
  if(!n)return err('Enter a name.');
  if(!type)return err('Choose Member, Visitor, or Regular Visitor.');
  if(!demo)return err('Choose Adult, Youth, or Kids.');
  err('');
  E.people.push({name:n,type,inv:type==='Member'?'':$('inv').value.trim(),demo});save();
  $('name').value='';$('inv').value='';type='';demo='';
  pick($('typeBtns'),null);pick($('demoBtns'),null);$('invWrap').classList.add('hide');
  render();$('name').focus();
};
function err(m){$('err').textContent=m}
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click()});
$('done').onclick=()=>{E.done=true;save();render()};
$('reopen').onclick=()=>{E.done=false;save();render()};
$('newEv').onclick=()=>{if(confirm('Start a new event? Download your files first; this clears the current list.')){E=null;try{localStorage.removeItem('evt-v2')}catch(e){}render()}};

function matrix(){
  const m={};TYPES.forEach(t=>{m[t]={Adult:0,Youth:0,Kids:0,Total:0}});
  const tot={Adult:0,Youth:0,Kids:0,Total:0};
  E.people.forEach(p=>{m[p.type][p.demo]++;m[p.type].Total++;tot[p.demo]++;tot.Total++});
  return{m,tot};
}
function render(){
  $('setup').classList.toggle('hide',!!E);$('live').classList.toggle('hide',!E);
  if(!E)return;
  $('evtitle').textContent=E.name;
  $('evwhen').textContent=[E.date,fmtTime(E.time)].filter(Boolean).join(' at ');
  $('checkin').classList.toggle('hide',E.done);
  $('finishBox').classList.toggle('hide',E.done);$('doneBox').classList.toggle('hide',!E.done);
  const tb=$('rows');tb.innerHTML='';
  E.people.forEach((p,i)=>{
    const tr=document.createElement('tr');
    [p.name].forEach(()=>{});
    const c=(t)=>{const td=document.createElement('td');td.textContent=t;return td};
    tr.append(c(p.name));
    const tt=document.createElement('td');const sp=document.createElement('span');sp.className='tag '+tagCls(p.type);sp.textContent=p.type;tt.append(sp);tr.append(tt);
    tr.append(c(p.inv||'-'),c(p.demo));
    const xd=document.createElement('td');xd.className='noprint';
    if(!E.done){const b=document.createElement('button');b.className='x';b.textContent='✕';b.setAttribute('aria-label','Remove '+p.name);b.onclick=()=>{E.people.splice(i,1);save();render()};xd.append(b)}
    tr.append(xd);tb.append(tr);
  });
  $('empty').classList.toggle('hide',E.people.length>0);
  const{m,tot}=matrix();
  $('sum').innerHTML=TYPES.map(t=>`<tr><td>${t}</td><td class="n">${m[t].Adult}</td><td class="n">${m[t].Youth}</td><td class="n">${m[t].Kids}</td><td class="n"><b>${m[t].Total}</b></td></tr>`).join('');
  $('sumfoot').innerHTML=`<tr><td>Total</td><td class="n">${tot.Adult}</td><td class="n">${tot.Youth}</td><td class="n">${tot.Kids}</td><td class="n">${tot.Total}</td></tr>`;
}

const fname=ext=>'attendance-'+(E.name.replace(/[^\w\-]+/g,'_'))+'-'+(E.date||'event')+'.'+ext;
const listRows=()=>E.people.map((p,i)=>[i+1,p.name,p.type,p.inv||'',p.demo]);
const sumRows=()=>{const{m,tot}=matrix();return[...TYPES.map(t=>[t,m[t].Adult,m[t].Youth,m[t].Kids,m[t].Total]),['Total',tot.Adult,tot.Youth,tot.Kids,tot.Total]]};
$('xlsx').onclick=()=>{
  if(typeof XLSX==='undefined')return alert('The Excel library could not load. Check your internet connection and try again.');
  const wb=XLSX.utils.book_new();
  const a=XLSX.utils.aoa_to_sheet([[E.name],['Date',E.date],['Time',fmtTime(E.time)],[],['No.','Name','Type','Invited by','Age group'],...listRows()]);
  a['!cols']=[{wch:6},{wch:30},{wch:16},{wch:26},{wch:12}];
  const s=XLSX.utils.aoa_to_sheet([[E.name],[],['Type','Adult','Youth','Kids','Total'],...sumRows()]);
  s['!cols']=[{wch:18},{wch:8},{wch:8},{wch:8},{wch:8}];
  XLSX.utils.book_append_sheet(wb,a,'Attendance');XLSX.utils.book_append_sheet(wb,s,'Summary');
  XLSX.writeFile(wb,fname('xlsx'));
};
$('pdf').onclick=()=>{
  if(!(window.jspdf&&window.jspdf.jsPDF))return alert('The PDF library could not load. Check your internet connection and try again.');
  const d=new window.jspdf.jsPDF();
  d.setFontSize(18);d.text(E.name,14,18);d.setFontSize(11);
  d.text('Date: '+(E.date||'-')+'     Time: '+(fmtTime(E.time)||'-'),14,26);
  d.autoTable({startY:32,head:[['Type','Adult','Youth','Kids','Total']],body:sumRows(),headStyles:{fillColor:[31,78,61]},
    didParseCell:h=>{if(h.row.index===4&&h.section==='body')h.cell.styles.fontStyle='bold'}});
  d.autoTable({startY:d.lastAutoTable.finalY+8,head:[['No.','Name','Type','Invited by','Age group']],body:listRows(),headStyles:{fillColor:[31,78,61]}});
  d.save(fname('pdf'));
};
$('csv').onclick=()=>{
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['No.','Name','Type','Invited by','Age group','Event','Date','Time'],...listRows().map(r=>[...r,E.name,E.date,fmtTime(E.time)])];
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download=fname('csv');document.body.appendChild(a);a.click();a.remove();
};
render();
</script>
</body>
</html>
